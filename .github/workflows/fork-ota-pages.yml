name: Fork OTA Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fork-ota-pages.yml'
      - 'tools/fork_stage_ota_pages.py'
      - 'fork_ota.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  stage:
    if: github.repository != 'wegooo-cell/read-pico-reader'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage GitHub Pages OTA site from Releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/fork_stage_ota_pages.py _site --repo "${{ github.repository }}"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.repository != 'wegooo-cell/read-pico-reader'
    runs-on: ubuntu-latest
    needs: [stage]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for Pages artifact metadata
        run: sleep 10
      - id: deployment
        uses: actions/deploy-pages@v4
